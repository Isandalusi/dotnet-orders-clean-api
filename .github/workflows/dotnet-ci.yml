name: CI - .NET 8 Build & xUnit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore tests/Orders.Tests/Orders.Tests.csproj
      - name: Build API
        run: dotnet build src/Orders.API/Orders.API.csproj --configuration Release
      - name: Run xUnit tests
        run: dotnet test tests/Orders.Tests/Orders.Tests.csproj --configuration Release --verbosity normal
